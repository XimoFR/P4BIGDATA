services:
  nifi:
    image: apache/nifi:1.28.1
    container_name: p4-nifi
    ports:
      - "8443:8443"
    environment:
      - SINGLE_USER_CREDENTIALS_USERNAME=admin
      - SINGLE_USER_CREDENTIALS_PASSWORD=ctsBtRBKHRAx69EqUghvvgEvjnaLjFEB
    volumes:
      - nifi-data:/opt/nifi/nifi-current/conf
      # PutFile escribe en /data/raw/nifi (dentro del contenedor) = ./data/raw/nifi en el host
      - ./data/raw/nifi:/data/raw/nifi

volumes:
  nifi-data:
